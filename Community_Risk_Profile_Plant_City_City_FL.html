 and MRI-Simmons. See <a target='_blank' href='https://links.esri.com/demographics/market-potential'>Market Potential data</a> for more information."},"HEALTHACS0NOHI":{"type":"number","alias":"2024 Pop <19: No Health Insurance (ACS 5-Yr)","vintage":"2020-2024","source":"ACS","units":null,"decimals":null,"definition":"ACS five-year estimate of the Population age <19 with No Health Insurance Coverage in the geographic area. Those whose only health coverage is Indian Health Service, or plans that only provide insurance for specific conditions such as cancer and long-term care policies are considered uninsured. Population includes U.S. civilians (not active duty Armed Forces) who do not reside in institutional group quarters facilities. Estimate and Margin of Error (MOE) from the U.S. Census American Community Survey (ACS) rolling sample 60-month survey; Esri Reliability measure designates the usability of the estimate. See <a target='_blank' href='https://links.esri.com/demographics/acs'>ACS data</a> for more information."},"HEALTHACS19NOHI":{"type":"number","alias":"2024 Pop 19-34: No Health Insurance (ACS 5-Yr)","vintage":"2020-2024","source":"ACS","units":null,"decimals":null,"definition":"ACS five-year estimate of the Population age 19-34 with No Health Insurance Coverage in the geographic area. Those whose only health coverage is Indian Health Service, or plans that only provide insurance for specific conditions such as cancer and long-term care policies are considered uninsured. Population includes U.S. civilians (not active duty Armed Forces) who do not reside in institutional group quarters facilities. Estimate and Margin of Error (MOE) from the U.S. Census American Community Survey (ACS) rolling sample 60-month survey; Esri Reliability measure designates the usability of the estimate. See <a target='_blank' href='https://links.esri.com/demographics/acs'>ACS data</a> for more information."},"HEALTHACS35NOHI":{"type":"number","alias":"2024 Pop 35-64: No Health Insurance (ACS 5-Yr)","vintage":"2020-2024","source":"ACS","units":null,"decimals":null,"definition":"ACS five-year estimate of the Population age 35-64 with No Health Insurance Coverage in the geographic area. Those whose only health coverage is Indian Health Service, or plans that only provide insurance for specific conditions such as cancer and long-term care policies are considered uninsured. Population includes U.S. civilians (not active duty Armed Forces) who do not reside in institutional group quarters facilities. Estimate and Margin of Error (MOE) from the U.S. Census American Community Survey (ACS) rolling sample 60-month survey; Esri Reliability measure designates the usability of the estimate. See <a target='_blank' href='https://links.esri.com/demographics/acs'>ACS data</a> for more information."},"HEALTHACS65NOHI":{"type":"number","alias":"2024 Pop 65+: No Health Insur (ACS 5-Yr)","vintage":"2020-2024","source":"ACS","units":null,"decimals":null,"definition":"ACS five-year estimate of the Population age 65+ with No Health Insurance Coverage in the geographic area. Those whose only health coverage is Indian Health Service, or plans that only provide insurance for specific conditions such as cancer and long-term care policies are considered uninsured. Population includes U.S. civilians (not active duty Armed Forces) who do not reside in institutional group quarters facilities. Estimate and Margin of Error (MOE) from the U.S. Census American Community Survey (ACS) rolling sample 60-month survey; Esri Reliability measure designates the usability of the estimate. See <a target='_blank' href='https://links.esri.com/demographics/acs'>ACS data</a> for more information."},"ATRISKTOTPOP_CY":{"type":"number","alias":"2026 Total Population","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 estimate of the Total Population in the geographic area. Total Population includes population living in households, on active duty in the Armed Forces, and living in group quarters such as correctional facilities, skilled nursing facilities, juvenile facilities, college dorms, and military barracks. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"ATRISKTOTHH_CY":{"type":"number","alias":"2026 Total Households","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 estimate of the Total Households in the geographic area. A household includes all people who occupy one housing unit (such as a house or apartment) as their usual residence. A household may include related family members, unrelated people, a person living alone, or a group of unrelated people sharing a housing unit, such as partners or roommates. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"ATRISKAVGHHSZ_CY":{"type":"number","alias":"2026 Average Household Size","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 estimate of Average Household Size in the geographic area. The Average Household Size is calculated by dividing the number of persons living in households by the total number of households in the current year. Households include all the people who occupy a housing unit (such as a house or apartment) as their usual residence.  See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"POPULATIONTOTALSPOPDENS_CY":{"type":"number","alias":"2026 Population Density","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 estimate of the Population Density (population per Square Mile) in the geographic area. Population density is computed by dividing the total population within the geographic area by the total land area, measured in square miles. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"HEALTHMEDHINC_CY":{"type":"number","alias":"2026 Median Household Income","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 estimate of Median Household Income in the geographic area. Median Household Income is the amount that divides household income (annual income for all household earners age 15+) into two equal groups in a geographic area; half of the population will have income higher than the median and half will have lower income. If the median falls in the upper income interval of $500,000+, it is represented by the value of $500,001. Esri uses the U.S. Census definition of income; reference <a target='_blank' href='https://links.esri.com/esri-demographics/vocab'>Esri Essential Vocabulary</a>. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"DISPOSABLEINCOMEMEDDI_CY":{"type":"number","alias":"2026 Median Disposable Income","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 estimate of the Median Disposable Income in the geographic area. Disposable Income represents money after taxes and provides an estimate of a household's purchasing power. Four types of taxes are deducted: federal individual income taxes, state individual income taxes, FICA (Social Security) and federal retirement payroll taxes, and property taxes for owner-occupied housing. Median Disposable Income divides disposable income distribution into two equal groups; half the population has disposable income higher than the median, and half lower. If the median is $200,000+, it is represented by a value of $200,001.  See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"HOUSEHOLDTOTALSINCMORT_CY":{"type":"number","alias":"2026 Pct of Income for Mortgage","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 estimate of the Percent of Income for Mortgage (POIFM) in the geographic area. This is the median percentage of household income dedicated to mortgage payments for a home priced at the median value. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"AGEDEPENDENCYSENIOR_CY_P":{"type":"number","alias":"2026 Senior Population: Percent","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 estimate of the total Senior Population (Age 65+) in the geographic area. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"ATRISKACSHHDIS_P":{"type":"number","alias":"2024 HHs w/1+ Persons w/Disability (ACS 5-Yr): Percent","vintage":"2020-2024","source":"ACS","units":null,"decimals":null,"definition":"ACS five-year estimate of the number of Households with 1+ Persons with a Disability in the geographic area. The U.S. Census Bureau defines disability broadly as difficulty with one of the following six basic areas of functioning–ambulation, cognition, hearing, independent living, self-care, and vision. Estimate and Margin of Error (MOE) from the U.S. Census American Community Survey (ACS) rolling sample 60-month survey; Esri Reliability measure designates the usability of the estimate. See <a target='_blank' href='https://links.esri.com/demographics/acs'>ACS data</a> for more information."},"ATRISKACSHHBPOV_P":{"type":"number","alias":"2024 HHs: Inc Below Poverty Level (ACS 5-Yr): Percent","vintage":"2020-2024","source":"ACS","units":null,"decimals":null,"definition":"ACS five-year estimate of the number of Households with income Below the Poverty Level in the geographic area. Estimate and Margin of Error (MOE) from the U.S. Census American Community Survey (ACS) rolling sample 60-month survey; Esri Reliability measure designates the usability of the estimate. See <a target='_blank' href='https://links.esri.com/demographics/acs'>ACS data</a> for more information."},"AGEDEPENDENCYCHILD_CY_P":{"type":"number","alias":"2026 Child Population: Percent","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 estimate of the total Child Population (Age 0-17) in the geographic area. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"ATRISKACSOVEH0_P":{"type":"number","alias":"2024 Owner HHs with 0 Vehicles (ACS 5-Yr): Percent","vintage":"2020-2024","source":"ACS","units":null,"decimals":null,"definition":"ACS five-year estimate of the number of Owner-occupied Households with No Vehicles in the geographic area. A housing unit is owner-occupied if the owner or co-owner lives in the unit, even if it is mortgaged or not fully paid for. Estimate and Margin of Error (MOE) from the U.S. Census American Community Survey (ACS) rolling sample 60-month survey; Esri Reliability measure designates the usability of the estimate. See <a target='_blank' href='https://links.esri.com/demographics/acs'>ACS data</a> for more information."},"HOUSEHOLDTYPEMHRWCU1820_P":{"type":"number","alias":"2020 Male HHr HH: Own Kids <18: Percent","vintage":"2020","source":"U.S. Census","units":null,"decimals":null,"definition":"U.S. Census 2020 count of the number of Households with Male Householder and no spouse or partner present with own children <18. Own children refers to those who is a son or daughter by birth, a stepchild, or an adopted child of the householder. Source U.S. Census 2020 DHC. See <a target='_blank' href='https://links. ","precision":0,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.ATRISKTOTPOP_CY","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 estimate of the Total Population in the geographic area. Total Population includes population living in households, on active duty in the Armed Forces, and living in group quarters such as correctional facilities, skilled nursing facilities, juvenile facilities, college dorms, and military barracks. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"dataCollectionsCalculator.ATRISKTOTHH_CY":{"id":"TOTHH_CY","fullName":"AtRisk.TOTHH_CY","alias":"2026 Total Households","fieldName":"ATRISKTOTHH_CY","precision":0,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.ATRISKTOTHH_CY","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 estimate of the Total Households in the geographic area. A household includes all people who occupy one housing unit (such as a house or apartment) as their usual residence. A household may include related family members, unrelated people, a person living alone, or a group of unrelated people sharing a housing unit, such as partners or roommates. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"dataCollectionsCalculator.ATRISKAVGHHSZ_CY":{"id":"AVGHHSZ_CY","fullName":"AtRisk.AVGHHSZ_CY","alias":"2026 Average Household Size","fieldName":"ATRISKAVGHHSZ_CY","precision":2,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.ATRISKAVGHHSZ_CY","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 estimate of Average Household Size in the geographic area. The Average Household Size is calculated by dividing the number of persons living in households by the total number of households in the current year. Households include all the people who occupy a housing unit (such as a house or apartment) as their usual residence.  See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"dataCollectionsCalculator.POPULATIONTOTALSPOPDENS_CY":{"id":"POPDENS_CY","fullName":"populationtotals.POPDENS_CY","alias":"2026 Population Density","fieldName":"POPULATIONTOTALSPOPDENS_CY","precision":1,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.POPULATIONTOTALSPOPDENS_CY","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 estimate of the Population Density (population per Square Mile) in the geographic area. Population density is computed by dividing the total population within the geographic area by the total land area, measured in square miles. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"dataCollectionsCalculator.HEALTHMEDHINC_CY":{"id":"MEDHINC_CY","fullName":"Health.MEDHINC_CY","alias":"2026 Median Household Income","fieldName":"HEALTHMEDHINC_CY","precision":0,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.HEALTHMEDHINC_CY","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 estimate of Median Household Income in the geographic area. Median Household Income is the amount that divides household income (annual income for all household earners age 15+) into two equal groups in a geographic area; half of the population will have income higher than the median and half will have lower income. If the median falls in the upper income interval of $500,000+, it is represented by the value of $500,001. E
